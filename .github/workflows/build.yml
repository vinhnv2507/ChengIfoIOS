name: Build ChengIOS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootful package
        shell: bash
        run: |
          set +e
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/chengios-rootful.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            tail -n 60 "$RUNNER_TEMP/chengios-rootful.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit "$build_status"
          fi
          set -e
          mkdir -p built-packages
          rootful_deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm.deb' -print -quit)"
          test -n "$rootful_deb"
          cp "$rootful_deb" built-packages/ChengIOS-rootful.deb

      - name: Build rootless package
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          rootless_deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$rootless_deb"
          cp "$rootless_deb" built-packages/ChengIOS-rootless.deb

      - name: Validate packages
        shell: bash
        run: |
          set -eu
          for package in built-packages/*.deb; do
            dpkg-deb --info "$package" >/dev/null
            contents="$(dpkg-deb --contents "$package")"
            printf '%s\n' "$contents" | grep -q 'ChengIOS.dylib'
            dpkg-deb --field "$package" Package Version Architecture
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ChengIOS-packages
          path: built-packages/*.deb
          if-no-files-found: error

      - name: Publish APT repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf apt-repo
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt-repo
          rm -f apt-repo/*.deb apt-repo/Packages apt-repo/Packages.gz apt-repo/Packages.bz2 apt-repo/Packages.xz apt-repo/Release
          rm -rf apt-repo/debs
          mkdir -p apt-repo/debs
          cp built-packages/*.deb apt-repo/debs/
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          (cd apt-repo && dpkg-scanpackages --multiversion debs /dev/null > Packages)
          gzip -9c apt-repo/Packages > apt-repo/Packages.gz
          cd apt-repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish ChengIOS packages" || true
          git push origin gh-pages
