name: Build ChengIOS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootful package
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p built-packages
          cp packages/*.deb built-packages/ChengIOS-rootful.deb

      - name: Build rootless package
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb built-packages/ChengIOS-rootless.deb

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          for package in built-packages/*.deb; do
            dpkg-deb --info "$package" >/dev/null
            dpkg-deb --contents "$package" | grep -q 'ChengIOS.dylib'
            dpkg-deb --field "$package" Package Version Architecture
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ChengIOS-packages
          path: built-packages/*.deb
          if-no-files-found: error

      - name: Publish APT repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf apt-repo
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt-repo
          mkdir -p apt-repo/debs
          cp built-packages/*.deb apt-repo/debs/
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          (cd apt-repo && dpkg-scanpackages debs /dev/null > Packages)
          gzip -9c apt-repo/Packages > apt-repo/Packages.gz
          cd apt-repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debs Packages Packages.gz
          git commit -m "Publish ChengIOS packages" || true
          git push origin gh-pages
