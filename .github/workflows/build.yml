name: Build and publish ChengIOS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootful package
        run: |
          make package FINALPACKAGE=1
          mkdir -p built-packages
          cp packages/*_iphoneos-arm.deb built-packages/

      - name: Build rootless package
        run: |
          make clean
          sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*_iphoneos-arm64.deb built-packages/

      - name: Install APT tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gzip

      - name: Validate packages
        run: |
          set -euo pipefail
          ls -l built-packages
          for package in built-packages/*.deb; do
            echo "Validating $package"
            dpkg-deb --info "$package"
            contents="$(dpkg-deb --contents "$package")"
            echo "$contents" | grep 'ChengIOS.dylib'
            echo "$contents" | grep 'ChengIOSPrefs.bundle'
            echo "$contents" | grep 'ChengIOSApp.app'
          done

      - name: Build APT repository
        run: |
          set -euo pipefail
          rm -rf apt-repo
          mkdir -p apt-repo/debs
          cp built-packages/*.deb apt-repo/debs/
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png apt-repo/CydiaIcon.png
          elif [ -f ChengIOSPrefs/Resources/icon@3x.png ]; then
            cp ChengIOSPrefs/Resources/icon@3x.png apt-repo/CydiaIcon.png
          fi
          cd apt-repo
          dpkg-scanpackages -m debs > Packages
          gzip -9c Packages > Packages.gz
          {
            echo 'Origin: ChengIOS'
            echo 'Label: ChengIOS'
            echo 'Suite: stable'
            echo 'Codename: ios'
            echo 'Version: 1.2.5'
            echo 'Architectures: iphoneos-arm iphoneos-arm64'
            echo 'Components: main'
            echo 'Description: ChengIOS Sileo repository'
          } > Release

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: chengios-packages
          path: built-packages/*.deb
          if-no-files-found: error
